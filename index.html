<html lang="ja">
<head>

<style>
:root{--ink:#302936;--cream:#fffaf2}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;color:var(--ink)}body{padding:10px;background:radial-gradient(#fff9 1.5px,transparent 1.5px),linear-gradient(140deg,#bdeafa,#f9e5d1 58%,#ffd8d2);background-size:24px 24px,auto}button{font:inherit;font-weight:900;border:3px solid var(--ink);border-radius:13px;padding:10px 12px;box-shadow:3px 4px 0 var(--ink);cursor:pointer;touch-action:manipulation}button:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}.game{width:min(930px,100%);margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.logo{font-size:clamp(1.7rem,4vw,2.5rem);font-weight:1000;letter-spacing:-.07em;text-shadow:2px 3px white}.logo b{color:#ff6b61}.subtitle{font-size:.75rem;font-weight:800;margin-top:4px}.stats{display:flex;gap:6px}.stat{min-width:62px;padding:6px 8px;text-align:center;border:2px solid var(--ink);border-radius:12px;background:#fffdf8;box-shadow:2px 3px 0 var(--ink)}.stat small{display:block;font-size:.64rem;font-weight:900}.stat strong{display:block;font-size:1.25rem}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(225px,.78fr);gap:12px}.arena{position:relative;height:min(66vh,570px);min-height:440px;overflow:hidden;border:3px solid var(--ink);border-radius:23px;background:linear-gradient(#c9efff 0 49%,#fff0d8 49% 53%,#e8bd91 53%);box-shadow:5px 6px 0 var(--ink);display:flex;align-items:flex-end;justify-content:center;padding:10px;cursor:pointer;user-select:none;touch-action:manipulation}.window{position:absolute;left:6%;top:16px;width:105px;height:92px;border:6px solid #b77c54;border-radius:8px;background:linear-gradient(#8bd9f7 0 72%,#a4d69a 72%)}.window:before,.window:after{content:"";position:absolute;background:#b77c54}.window:before{height:100%;width:5px;left:50%}.window:after{width:100%;height:5px;top:50%}.plant{position:absolute;left:5%;bottom:66px;font-size:2.4rem}.shelf{position:absolute;right:0;top:100px;width:55px;height:130px;background:#c28d68;border:3px solid #93664d;border-right:0;border-radius:8px 0 0 8px;display:grid;place-items:center;font-size:1.2rem}.cat-wrap{position:relative;z-index:2;width:min(300px,78%);margin-bottom:50px;transform-origin:50% 90%}.cat{display:block;width:100%;filter:drop-shadow(0 6px 0 #9b725333)}.cat-wrap.punched{animation:punch .48s cubic-bezier(.2,.9,.3,1)}.cat-wrap.comforted{animation:comfort .8s ease}@keyframes punch{0%{transform:translate(0) rotate(0) scale(1)}15%{transform:translate(17px,3px) rotate(7deg) scale(.94)}35%{transform:translate(-12px,-4px) rotate(-6deg) scale(1.04)}58%{transform:translate(5px,0) rotate(3deg)}100%{transform:translate(0) rotate(0) scale(1)}}@keyframes comfort{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-11px) scale(1.03)}55%{transform:translateY(1px)}75%{transform:rotate(-3deg)}}.cat .bump,.cat .bruise,.cat .tear,.cat .heart,.cat .eyes-angry,.cat .eyes-sad,.cat .mouth-angry,.cat .mouth-sad{opacity:0;transition:opacity .2s}.cat[data-stage="1"] .bump{opacity:1}.cat[data-stage="2"] .bump,.cat[data-stage="2"] .bruise,.cat[data-stage="2"] .eyes-angry,.cat[data-stage="2"] .mouth-angry{opacity:1}.cat[data-stage="3"] .bump,.cat[data-stage="3"] .bruise,.cat[data-stage="3"] .tear,.cat[data-stage="3"] .eyes-sad,.cat[data-stage="3"] .mouth-sad{opacity:1}.cat[data-mood="comfort"] .heart,.cat[data-mood="happy"] .heart{opacity:1}.cat[data-mood="comfort"] .eyes-normal,.cat[data-mood="happy"] .eyes-normal{opacity:0}.cat[data-mood="comfort"] .eyes-happy,.cat[data-mood="happy"] .eyes-happy{opacity:1}.eyes-happy{opacity:0}.speech{position:absolute;z-index:5;left:50%;bottom:13px;transform:translateX(-50%);width:min(90%,390px);min-height:53px;display:flex;align-items:center;justify-content:center;text-align:center;padding:9px 14px;background:#fffdf8;border:3px solid var(--ink);border-radius:17px;font-weight:1000;font-size:clamp(.8rem,2vw,.98rem);line-height:1.35;box-shadow:2px 3px #30293622}.speech:before{content:"";position:absolute;top:-9px;left:50%;width:13px;height:13px;background:#fffdf8;border-left:3px solid var(--ink);border-top:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}.shadow{position:absolute;bottom:65px;width:55%;height:16px;background:#9d6f5045;border-radius:50%}.hit-text{position:absolute;z-index:6;left:50%;top:36%;transform:translate(-50%,-50%) scale(.4);opacity:0;color:#ff604e;font-weight:1000;font-size:clamp(2.3rem,7vw,4rem);-webkit-text-stroke:2px white;text-shadow:3px 3px var(--ink);white-space:nowrap;pointer-events:none}.hit-text.show{animation:hit .78s ease-out}@keyframes hit{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-15deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.2) rotate(8deg)}58%{opacity:1;transform:translate(-50%,-72%) scale(1)}100%{opacity:0;transform:translate(-50%,-105%) scale(.8)}}.fist{position:absolute;z-index:6;right:12%;top:36%;font-size:clamp(3rem,9vw,4.7rem);opacity:0;pointer-events:none}.fist.show{animation:fist .46s ease-in-out}@keyframes fist{0%{opacity:0;transform:translate(70px,-20px) rotate(25deg) scale(.55)}35%{opacity:1;transform:translate(-45px,10px) rotate(-15deg) scale(1.15)}100%{opacity:0;transform:translate(-75px,25px) rotate(-20deg) scale(.9)}}.float{position:absolute;z-index:7;pointer-events:none;font-weight:1000;font-size:1.15rem;animation:float 1s ease-out forwards;text-shadow:2px 2px white}@keyframes float{0%{opacity:0;transform:translateY(12px) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translateY(-75px) scale(1.1)}}.side{display:flex;flex-direction:column;gap:9px}.panel{border:2px solid var(--ink);border-radius:17px;background:var(--cream);padding:12px;box-shadow:3px 4px var(--ink)}.meter-label,.progress-head{display:flex;justify-content:space-between;gap:5px;font-size:.76rem;font-weight:1000}.meter{height:18px;border:2px solid var(--ink);border-radius:18px;background:#e9ddd1;overflow:hidden;margin-top:6px}.meter-fill{height:100%;width:0%;background:repeating-linear-gradient(135deg,#ff9b89 0 10px,#ffb5a8 10px 20px);transition:width .3s}.caption{font-size:.68rem;font-weight:800;margin-top:4px;color:#675966}.xp-meter{height:10px;border:2px solid var(--ink);border-radius:15px;background:#e9ddd1;overflow:hidden;margin-top:5px}.xp-fill{height:100%;width:0%;background:linear-gradient(90deg,#ffe27a,#ffae49);transition:width .3s}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}#punch{background:#ffb94f}#comfort{background:#ffb7cf}#reset{background:white;width:100%;font-size:.78rem;padding:7px}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}.level{border:2px solid #d5c5b6;border-radius:9px;background:white;text-align:center;padding:6px 1px;font-size:.62rem;font-weight:900;opacity:.6}.level span{display:block;font-size:1.15rem}.level.active{opacity:1;border-color:var(--ink);background:#ffe6aa}.long{height:12px;margin-top:6px;border:2px solid var(--ink);border-radius:20px;background:#e9ded0;overflow:hidden}.long-fill{height:100%;width:0%;background:linear-gradient(90deg,#ffcb59,#ff8d8d,#bca2ef);transition:width .35s}.note{text-align:center;font-size:.68rem;color:#66555b;font-weight:700;margin:10px 0 0}
@media(max-width:700px){body{padding:8px}.layout{grid-template-columns:1fr;gap:9px}.arena{height:clamp(350px,49vh,440px);min-height:350px}.cat-wrap{width:min(280px,74%);margin-bottom:48px}.side{display:grid;grid-template-columns:1fr 1fr;gap:8px}.side .panel:first-child{grid-column:1/-1}.window{width:82px;height:75px}.shelf{top:95px}.plant{bottom:60px}.stat{min-width:0;flex:1;padding:5px 6px}.stat strong{font-size:1.15rem}.subtitle{font-size:.68rem}}
@media(max-width:390px){.arena{height:340px;min-height:340px}.cat-wrap{width:74%;margin-bottom:46px}.speech{width:92%;font-size:.78rem;min-height:48px;padding:7px 10px}.side{grid-template-columns:1fr}.side .panel:first-child{grid-column:auto}.logo{font-size:1.65rem}}
@media(min-width:701px) and (max-height:780px){.arena{height:420px;min-height:420px}.cat-wrap{width:270px}.panel{padding:9px}.side{gap:7px}}
</style>
</head>
<body><main class="game">

<div class="hit-text" id="hitText">バシッ！</div>

<aside class="side">
<section class="panel"><div class="meter-label"><span>😾 イライラ</span><span id="irritationText">0 / 100</span></div><div class="meter"><div class="meter-fill" id="irritation"></div></div><div class="caption" id="moodCaption">まだ余裕そう。腹立つ。</div><div style="margin-top:11px" class="meter-label"><span>💗 なかよし度</span><span id="bondText">0 / 100</span></div><div class="xp-meter"><div class="xp-fill" id="bondMeter"></div></div><div class="caption">なぐさめると少しずつ回復。</div></section>
<section class="panel"><div style="font-weight:1000;font-size:.92rem;margin-bottom:8px">🎮 アクション</div><div class="actions"><button id="punch">👊 パンチ！</button><button id="comfort">🫳 なぐさめる</button></div><div style="margin-top:10px"><button id="reset">↻ はじめから</button></div></section>
<section class="panel"><div class="progress-head"><span>🐾 表情の変化</span><span id="levelText">生意気モード</span></div><div class="long"><div class="long-fill" id="longFill"></div></div><div class="levels"><div class="level active" data-stage-card="0"><span>😼</span>生意気</div><div class="level" data-stage-card="1"><span>😾</span>たんこぶ</div><div class="level" data-stage-card="2"><span>😠</span>イライラ</div><div class="level" data-stage-card="3"><span>🥹</span>涙目</div></div></section>
</aside></div>
<p class="note">なぐさめると機嫌が少し戻ることも。※ゲーム内のコミカルな演出です。</p>
</main>
<script>
const $=id=>document.getElementById(id);let xp=0,punches=0,bond=0,irritation=0,combo=0,lastAction=0,audioContext;
const punchLines=["は？ なに見てんの？","その手、しまってくれる？","ぼくの毛並みが乱れるんだけど。","効いてないし？ 全然？","今の、パンチのつもり？","ふーん。やるじゃん。ムカつく。","ぼくの許可取った？","その顔やめて。腹立つ。","あとで絶対おぼえてろよ。","……ちょっとだけ痛い。ちょっとだけ！","ぼくは強い。たぶん。","いまのはノーカン！","爪とぎのほうがまだマシ！","その自信どこから来るの？","にゃ、にゃんだよ！","別に泣いてないし！","目にゴミが入っただけだし！","もう知らない！……ちらっ。","そんなに構ってほしいの？","むすーっ！ もう一回やったら怒るからね！","耳がぺたんこ？ これは仕様です。","ぼくのほうがかわいいし！","……ちょっとだけ、手加減して。","今の見てた？ 見てないよね？","ぷるぷる……怒ってない、怒ってない！"];
const comfortLines=["……別に、うれしくないし。","そこ、もうちょっと右。","ゴロゴロ……はっ！ 今の聞いた？","今日は特別に許してあげる。","手、あったかいね。ちょっとだけ。","べ、別に甘えてないから。","あと3秒だけなでていいよ。","その手はパンチ以外にも使えるんだ。","……もう一回。今のはよかった。","キミ、たまにはいいやつだね。","喉が鳴ってる？ 気のせい。","ぼくのこと好きすぎじゃない？","ふにゃ……はっ、油断した！","今日だけ隣にいてもいいよ。","さっきのこと？ まだ許してない。でも、なでて。","……すき。い、今のは聞かなかったことにして！","もっとなでてもいいけど？ 特別だからね。","ふわぁ……眠くなってきた。","キミの手、けっこう好きかも。","……ありがと。ちょっと元気出た。"];
const hitWords=["バシッ！","ポカッ！","ペチン！","ドスッ！","ボフッ！","パシーン！","ぽすっ！","むにっ！"],stages=["生意気モード","たんこぶ発生！","イライラ上昇中","涙目モード"];
function stageFor(){return xp>=30?3:xp>=15?2:xp>=5?1:0}function pick(a){return a[Math.floor(Math.random()*a.length)]}function say(t){$("speech").textContent=t}
function sound(kind){try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==="suspended")audioContext.resume();const n=audioContext.currentTime,o=audioContext.createOscillator(),g=audioContext.createGain();o.type=kind==="comfort"?"sine":"triangle";o.frequency.setValueAtTime(kind==="comfort"?500:230,n);o.frequency.exponentialRampToValueAtTime(kind==="comfort"?740:90,n+.15);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(kind==="comfort"?.08:.13,n+.015);g.gain.exponentialRampToValueAtTime(.0001,n+.24);o.connect(g);g.connect(audioContext.destination);o.start(n);o.stop(n+.25)}catch(e){}}
function floatText(t,color){const e=document.createElement("div");e.className="float";e.textContent=t;e.style.left=(30+Math.random()*40)+"%";e.style.top=(35+Math.random()*25)+"%";if(color)e.style.color=color;$("arena").appendChild(e);setTimeout(()=>e.remove(),1050)}
function animate(c){const e=$("catWrap");e.classList.remove("punched","comforted");void e.offsetWidth;e.classList.add(c)}
function update(){const s=stageFor();$("score").textContent=punches;$("xp").textContent=xp;$("bond").textContent=bond;$("irritationText").textContent=irritation+" / 100";$("irritation").style.width=irritation+"%";$("bondText").textContent=bond+" / 100";$("bondMeter").style.width=bond+"%";$("moodCaption").textContent=irritation<20?"まだ余裕そう。腹立つ。":irritation<45?"眉間にしわが寄ってきた。":irritation<70?"しっぽがバンバンしている！":"限界っぽい。なぐさめるといいかも。";$("cat").dataset.stage=s;$("levelText").textContent=stages[s];$("longFill").style.width=Math.min(xp/40*100,100)+"%";document.querySelectorAll("[data-stage-card]").forEach(c=>c.classList.toggle("active",Number(c.dataset.stageCard)===s))}
function punch(){punches++;xp++;irritation=Math.min(100,irritation+(stageFor()===3?2:4));const now=Date.now();combo=now-lastAction<1500?combo+1:1;lastAction=now;$("cat").dataset.mood="normal";$("hitText").textContent=pick(hitWords);$("hitText").classList.remove("show");$("fist").classList.remove("show");void $("hitText").offsetWidth;$("hitText").classList.add("show");$("fist").classList.add("show");animate("punched");say(pick(punchLines));floatText("+1 XP","#ed6459");if(combo>=4)floatText(combo+" COMBO!","#9667c9");if(punches%8===0)say(pick(["ちょっと休憩しない？ ……しないの？","ぼくの顔、さっきより変じゃない？","まだやるの……？ ふーん。","……もう、ばか。"]));if(irritation===100){say("もうやだぁ……ちょっと離れてて！");$("catWrap").style.filter="brightness(0.85) saturate(1.4)";setTimeout(()=>{$("catWrap").style.filter=""},800);floatText("限界！！","#ff3b3b")}update();sound("punch")}
function comfort(){const before=irritation;bond=Math.min(100,bond+8);irritation=Math.max(0,irritation-12);$("cat").dataset.mood=bond>=70?"happy":"comfort";animate("comforted");say(pick(comfortLines));floatText("+8 なかよし","#e65e99");if(before>0&&irritation===0){say("……もう怒ってない。たぶん。");floatText("ごきげん回復！","#53a9c7")}update();sound("comfort")}
function reset(){xp=0;punches=0;bond=0;irritation=0;combo=0;lastAction=0;$("speech").textContent="……なに？ その顔。";$("cat").dataset.mood="normal";$("hitText").classList.remove("show");$("fist").classList.remove("show");$("catWrap").style.filter="";update()}
$("arena").addEventListener("pointerdown",e=>{if(!e.target.closest("button"))punch()});$("punch").addEventListener("click",punch);$("comfort").addEventListener("click",comfort);$("reset").addEventListener("click",reset);update();
</script></body></html>
