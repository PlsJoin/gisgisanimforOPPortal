<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>YORIMICHI</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #f8f9fb;
      --surface: #fff;
      --text: #111;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --soft: #eff6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    button, input, select { font: inherit; border: none; background: none; outline: none; }
    button { cursor: pointer; }

    .app { height: 100%; position: relative; }
    #map { width: 100%; height: 100%; }

    /* 検索バー */
    .bar {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000;
      max-width: 420px; margin: 0 auto;
      background: var(--surface); border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.1); overflow: hidden;
    }
    .bar-row {
      display: flex; align-items: center; gap: 6px; padding: 8px 10px;
    }
    .bar-row input {
      flex: 1; height: 38px; font-size: 15px; background: transparent;
    }
    .bar-row input::placeholder { color: #9ca3af; }
    .btn-icon {
      width: 38px; height: 38px; border-radius: 10px;
      display: grid; place-items: center; color: var(--muted); font-size: 17px;
    }
    .btn-icon:active { background: var(--bg); }
    .btn-search {
      height: 38px; padding: 0 14px; border-radius: 10px;
      background: var(--accent); color: #fff; font-weight: 700; font-size: 14px;
    }
    .btn-search:disabled { opacity: .5; }

    .cats {
      display: flex; gap: 6px; padding: 0 10px 10px; overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .cat {
      flex-shrink: 0; height: 32px; padding: 0 12px; border-radius: 999px;
      border: 1px solid var(--line); font-size: 13px; color: var(--muted);
      background: var(--surface);
    }
    .cat.active {
      background: var(--soft); border-color: var(--accent); color: var(--accent); font-weight: 700;
    }

    /* 結果シート */
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 900;
      background: var(--surface); border-radius: 20px 20px 0 0;
      box-shadow: 0 -6px 30px rgba(0,0,0,.08);
      max-height: 46vh; display: flex; flex-direction: column;
      transform: translateY(calc(100% - 52px));
      transition: transform .25s ease;
    }
    .sheet.open { transform: translateY(0); }
    .handle {
      width: 36px; height: 4px; background: #d1d5db; border-radius: 2px;
      margin: 10px auto 4px;
    }
    .sheet-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 16px 10px; font-size: 14px;
    }
    .sheet-head b { font-weight: 700; }
    .sheet-head span { color: var(--muted); font-size: 13px; cursor: pointer; }
    .list {
      flex: 1; overflow-y: auto; padding: 0 10px 24px;
      -webkit-overflow-scrolling: touch;
    }
    .card {
      display: flex; gap: 12px; padding: 12px; border-radius: 14px;
      cursor: pointer; transition: background .12s;
    }
    .card:active, .card.on { background: var(--bg); }
    .card-icon {
      width: 42px; height: 42px; border-radius: 12px; background: var(--soft);
      display: grid; place-items: center; font-size: 18px; flex-shrink: 0;
    }
    .card-body { flex: 1; min-width: 0; }
    .card-name {
      font-size: 15px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-addr {
      font-size: 12px; color: var(--muted); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .empty {
      padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6;
    }

    /* マーカー */
    .pin {
      width: 34px; height: 34px; background: var(--accent); color: #fff;
      border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }
    .pin span { transform: rotate(45deg); font-size: 13px; }

    .leaflet-control-zoom {
      border: none !important; border-radius: 10px !important;
      box-shadow: 0 2px 10px rgba(0,0,0,.12) !important; overflow: hidden;
    }
    .leaflet-control-zoom a {
      width: 34px !important; height: 34px !important; line-height: 34px !important;
      color: var(--text) !important;
    }
    .leaflet-popup-content-wrapper { border-radius: 12px; }
    .leaflet-popup-content { margin: 10px 12px; font-size: 13px; }
    .leaflet-popup-content b { display: block; font-size: 14px; margin-bottom: 2px; }

    .src {
      position: absolute; bottom: 56px; left: 8px; z-index: 400;
      font-size: 10px; color: #666; background: rgba(255,255,255,.9);
      padding: 2px 6px; border-radius: 4px;
    }

    @media (min-width: 720px) {
      .bar { left: 20px; right: auto; width: 380px; }
      .sheet {
        left: 20px; right: auto; width: 380px; bottom: 20px;
        max-height: 52vh; border-radius: 16px; transform: none;
      }
      .handle { display: none; }
      .src { bottom: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="map"></div>
    <div class="src">OpenPOI / Overture Maps / 食品営業許可オープンデータ</div>

    <div class="bar">
      <div class="bar-row">
        <button class="btn-icon" id="locBtn" title="現在地">📍</button>
        <input id="q" type="text" placeholder="駅・地名（例：渋谷）" autocomplete="off">
        <button class="btn-search" id="go">探す</button>
      </div>
      <div class="cats" id="cats">
        <button class="cat active" data-q="カフェ">カフェ</button>
        <button class="cat" data-q="レストラン 食堂">飲食</button>
        <button class="cat" data-q="コンビニ">コンビニ</button>
        <button class="cat" data-q="公園">公園</button>
        <button class="cat" data-q="書店 本屋">本屋</button>
        <button class="cat" data-q="">なんでも</button>
      </div>
    </div>

    <div class="sheet" id="sheet">
      <div class="handle"></div>
      <div class="sheet-head">
        <b id="count">場所を入れて探してください</b>
        <span id="clear">クリア</span>
      </div>
      <div class="list" id="list">
        <div class="empty">駅名や地名を入れて「探す」を押してください</div>
      </div>
    </div>
  </div>

  <script>
    let center = null;
    let markers = [];
    let active = null;
    let currentCat = "カフェ";

    const map = L.map("map", { zoomControl: false }).setView([35.6812, 139.7671], 13);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "© OSM"
    }).addTo(map);
    L.control.zoom({ position: "bottomright" }).addTo(map);

    const $q = document.getElementById("q");
    const $go = document.getElementById("go");
    const $list = document.getElementById("list");
    const $count = document.getElementById("count");
    const $sheet = document.getElementById("sheet");

    // カテゴリ選択
    document.querySelectorAll(".cat").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".cat").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentCat = btn.dataset.q;
      });
    });

    async function geocode(text) {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(text)}&format=json&limit=1&countrycodes=jp`,
        { headers: { "User-Agent": "YORIMICHI/1.0" } }
      );
      const data = await res.json();
      if (!data[0]) return null;
      return { lat: +data[0].lat, lng: +data[0].lon };
    }

    async function fetchPOI(c, keyword) {
      const p = new URLSearchParams({ limit: 25 });
      if (keyword) p.set("q", keyword);
      if (c) {
        p.set("center", `${c.lng},${c.lat}`);
        p.set("radius", 1200);
      } else {
        // 位置指定なしの場合は東京駅周辺
        p.set("center", "139.7671,35.6812");
        p.set("radius", 800);
        if (!keyword) p.set("q", "カフェ");
      }
      const res = await fetch(`https://api.openpoiapi.com/v1/search?${p}`);
      if (!res.ok) throw new Error("APIエラー");
      const json = await res.json();
      return (json.results || [])
        .filter(r => r.lat && r.lng && r.name)
        .map((r, i) => ({
          id: i,
          name: r.name.replace(/^１Ｆ\s*|^1F\s*/i, "").trim(),
          addr: r.address || [r.prefecture, r.city].filter(Boolean).join(""),
          lat: r.lat,
          lng: r.lng,
          cat: r.category || r.business_type || ""
        }));
    }

    function clearMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }

    function putMarkers(items) {
      clearMarkers();
      if (!items.length) return;
      const bounds = [];
      items.forEach(p => {
        const icon = L.divIcon({
          className: "",
          html: `<div class="pin"><span>📍</span></div>`,
          iconSize: [34, 34],
          iconAnchor: [17, 34],
          popupAnchor: [0, -34]
        });
        const m = L.marker([p.lat, p.lng], { icon })
          .addTo(map)
          .bindPopup(`<b>${p.name}</b><div style="color:#6b7280;font-size:12px;margin-top:3px">${p.addr || ""}</div>`);
        m.on("click", () => {
          active = p.id;
          render(items);
        });
        markers.push(m);
        bounds.push([p.lat, p.lng]);
      });
      map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
    }

    function render(items) {
      if (!items.length) {
        $list.innerHTML = `<div class="empty">見つかりませんでした<br>場所やジャンルを変えてみてください</div>`;
        $count.textContent = "0件";
        $sheet.classList.add("open");
        return;
      }
      $count.innerHTML = `<b>${items.length}件</b>`;
      $list.innerHTML = items.map(p => `
        <div class="card ${active === p.id ? "on" : ""}" data-id="${p.id}">
          <div class="card-icon">📍</div>
          <div class="card-body">
            <div class="card-name">${p.name}</div>
            <div class="card-addr">${p.addr || "住所情報なし"}</div>
          </div>
        </div>
      `).join("");

      $list.querySelectorAll(".card").forEach(el => {
        el.onclick = () => {
          const id = +el.dataset.id;
          const p = items.find(x => x.id === id);
          if (!p) return;
          active = id;
          render(items);
          map.setView([p.lat, p.lng], 16);
          const m = markers.find(mk => {
            const ll = mk.getLatLng();
            return Math.abs(ll.lat - p.lat) < 0.00005;
          });
          if (m) m.openPopup();
        };
      });
      $sheet.classList.add("open");
    }

    async function run() {
      $go.disabled = true;
      $go.textContent = "…";
      active = null;
      $list.innerHTML = `<div class="empty">検索中…</div>`;
      $sheet.classList.add("open");

      try {
        const text = $q.value.trim();
        let c = null;
        if (text && text !== "現在地") {
          c = await geocode(text);
          if (!c) throw new Error("場所が見つかりません");
          center = c;
        } else if (center && text === "現在地") {
          c = center;
        }

        const items = await fetchPOI(c, currentCat);
        putMarkers(items);
        render(items);
      } catch (e) {
        $list.innerHTML = `<div class="empty">${e.message || "エラーが起きました"}</div>`;
        $count.textContent = "エラー";
        clearMarkers();
      } finally {
        $go.disabled = false;
        $go.textContent = "探す";
      }
    }

    $go.onclick = run;
    $q.onkeydown = e => { if (e.key === "Enter") run(); };

    document.getElementById("locBtn").onclick = () => {
      if (!navigator.geolocation) return alert("位置情報非対応");
      $go.disabled = true;
      $go.textContent = "…";
      navigator.geolocation.getCurrentPosition(
        pos => {
          center = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          $q.value = "現在地";
          run();
        },
        () => {
          alert("位置情報を取得できませんでした");
          $go.disabled = false;
          $go.textContent = "探す";
        }
      );
    };

    document.getElementById("clear").onclick = () => {
      $q.value = "";
      center = null;
      active = null;
      clearMarkers();
      $list.innerHTML = `<div class="empty">駅名や地名を入れて「探す」を押してください</div>`;
      $count.textContent = "場所を入れて探してください";
      $sheet.classList.remove("open");
      map.setView([35.6812, 139.7671], 13);
    };
  </script>
</body>
</html>
