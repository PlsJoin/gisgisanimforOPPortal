<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>YORIMICHI | すぐ探せるお出かけマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --text: #1a1d23;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    button, input, select { font: inherit; }
    button { cursor: pointer; border: none; background: none; }

    .app { height: 100%; position: relative; }
    #map { width: 100%; height: 100%; }

    .search-float {
      position: absolute; top: 16px; left: 16px; right: 16px; z-index: 1000;
      max-width: 480px; margin: 0 auto;
    }
    .search-card {
      background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden;
    }
    .search-main {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    }
    .search-main input {
      flex: 1; height: 40px; border: none; outline: none; font-size: 15px; background: transparent;
    }
    .search-main input::placeholder { color: #9ca3af; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
      color: var(--muted); font-size: 18px; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--bg); color: var(--accent); }
    .search-btn {
      height: 40px; padding: 0 16px; border-radius: 12px; background: var(--accent);
      color: #fff; font-weight: 700; font-size: 14px; flex-shrink: 0;
    }
    .search-btn:disabled { opacity: 0.6; }

    .filters { display: none; padding: 0 14px 14px; border-top: 1px solid var(--line); }
    .filters.open { display: block; }
    .filter-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    select {
      height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px;
      background: var(--bg); font-size: 13px; color: var(--text); outline: none;
    }
    .chip {
      height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--surface); font-size: 12px; color: var(--muted);
    }
    .chip.active {
      background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700;
    }
    .toggle-filters {
      width: 100%; padding: 8px; font-size: 12px; color: var(--muted); text-align: center;
      border-top: 1px solid var(--line);
    }
    .toggle-filters:hover { color: var(--accent); }

    .sheet {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 900;
      background: var(--surface); border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 30px rgba(0,0,0,0.1); max-height: 48vh;
      display: flex; flex-direction: column;
      transform: translateY(calc(100% - 56px)); transition: transform 0.3s ease;
    }
    .sheet.open { transform: translateY(0); }
    .sheet-handle {
      width: 40px; height: 4px; background: #d1d5db; border-radius: 2px;
      margin: 10px auto 6px; flex-shrink: 0;
    }
    .sheet-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 4px 18px 12px; font-size: 14px; flex-shrink: 0;
    }
    .sheet-header strong { font-weight: 700; }
    .sheet-list {
      flex: 1; overflow-y: auto; padding: 0 12px 20px; -webkit-overflow-scrolling: touch;
    }
    .item {
      display: flex; gap: 12px; padding: 12px; border-radius: 14px; cursor: pointer;
      transition: background 0.15s;
    }
    .item:hover, .item.active { background: var(--bg); }
    .item-icon {
      width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft);
      display: grid; place-items: center; font-size: 20px; flex-shrink: 0;
    }
    .item-body { flex: 1; min-width: 0; }
    .item-cat { font-size: 11px; color: var(--accent); font-weight: 700; }
    .item-name { font-size: 15px; font-weight: 700; margin: 2px 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-meta { font-size: 12px; color: var(--muted); line-height: 1.4; }

    .empty { padding: 30px 20px; text-align: center; color: var(--muted); font-size: 13px; }

    .marker-pin {
      width: 36px; height: 36px; background: var(--accent); color: #fff;
      border-radius: 50% 50% 50% 0; transform: rotate(-45deg);
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .marker-pin span { transform: rotate(45deg); font-size: 14px; }

    .leaflet-control-zoom { border: none !important; box-shadow: var(--shadow) !important; border-radius: 12px !important; overflow: hidden; }
    .leaflet-control-zoom a { width: 36px !important; height: 36px !important; line-height: 36px !important; color: var(--text) !important; }
    .leaflet-popup-content-wrapper { border-radius: 14px; box-shadow: var(--shadow); }
    .leaflet-popup-content { margin: 12px 14px; font-size: 13px; }
    .leaflet-popup-content strong { display: block; font-size: 15px; margin-bottom: 2px; }

    .notice {
      position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.95); padding: 6px 12px; border-radius: 8px;
      font-size: 11px; color: var(--muted); z-index: 800; box-shadow: var(--shadow);
      pointer-events: none; white-space: nowrap;
    }
    .attribution {
      position: absolute; bottom: 60px; left: 8px; z-index: 500;
      font-size: 10px; color: #666; background: rgba(255,255,255,0.85);
      padding: 3px 6px; border-radius: 4px; max-width: 220px; line-height: 1.3;
    }

    @media (min-width: 768px) {
      .search-float { left: 24px; right: auto; width: 400px; }
      .sheet { left: 24px; right: auto; width: 400px; max-height: 55vh; border-radius: 18px; bottom: 24px; transform: translateY(0); }
      .sheet-handle { display: none; }
      .attribution { bottom: 12px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="map"></div>
    <div class="notice">実在施設データ（OpenPOI）を使用中</div>
    <div class="attribution">データ: OpenPOI API（Overture Maps / Japan Food Facilities）</div>

    <div class="search-float">
      <div class="search-card">
        <div class="search-main">
          <button class="icon-btn" id="locBtn" title="現在地">📍</button>
          <input id="location" type="text" placeholder="駅名・地名（例：渋谷）" autocomplete="off">
          <button class="search-btn" id="searchBtn">探す</button>
        </div>
        <div class="filters" id="filters">
          <div class="filter-row">
            <select id="category">
              <option value="all">ジャンル：すべて</option>
              <option value="cafe">カフェ</option>
              <option value="restaurant">飲食店</option>
              <option value="shopping">買い物</option>
              <option value="sightseeing">観光・遊び</option>
              <option value="park">公園・休憩</option>
            </select>
          </div>
          <div class="filter-row" style="font-size:11px;color:var(--muted);">
            ※予算・Suica・営業中などの詳細条件はデータに無いため非対応
          </div>
        </div>
        <button class="toggle-filters" id="toggleFilters">条件を指定する ▾</button>
      </div>
    </div>

    <div class="sheet" id="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <strong id="countText">場所を入れて探してください</strong>
        <span id="clearBtn" style="cursor:pointer;color:var(--muted);font-size:13px;">クリア</span>
      </div>
      <div class="sheet-list" id="list">
        <div class="empty">駅名や地名を入れて「探す」を押してください</div>
      </div>
    </div>
  </div>

  <script>
    // カテゴリ → 検索キーワード / アイコン
    const CATEGORY_MAP = {
      all: { q: "", icon: "📍" },
      cafe: { q: "カフェ", icon: "☕" },
      restaurant: { q: "レストラン 食堂 居酒屋", icon: "🍜" },
      shopping: { q: "ショップ 商店 デパート", icon: "🛍️" },
      sightseeing: { q: "観光 博物館 寺 神社", icon: "🏯" },
      park: { q: "公園 広場", icon: "🌳" }
    };

    let lastCenter = null;
    let markers = [];
    let activeId = null;
    let currentResults = [];

    // 地図
    const map = L.map("map", { zoomControl: false }).setView([35.6812, 139.7671], 12);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap",
      maxZoom: 19
    }).addTo(map);
    L.control.zoom({ position: "bottomright" }).addTo(map);

    const locationInput = document.getElementById("location");
    const categorySelect = document.getElementById("category");
    const searchBtn = document.getElementById("searchBtn");
    const listEl = document.getElementById("list");
    const countText = document.getElementById("countText");
    const sheet = document.getElementById("sheet");
    const filters = document.getElementById("filters");
    const toggleBtn = document.getElementById("toggleFilters");

    toggleBtn.addEventListener("click", () => {
      filters.classList.toggle("open");
      toggleBtn.textContent = filters.classList.contains("open") ? "条件を閉じる ▴" : "条件を指定する ▾";
    });

    // ジオコーディング
    async function geocode(q) {
      if (!q.trim()) return null;
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&countrycodes=jp`,
        { headers: { "User-Agent": "YORIMICHI/1.0" } }
      );
      const data = await res.json();
      if (!data.length) return null;
      return { lat: +data[0].lat, lng: +data[0].lon };
    }

    // OpenPOI 検索
    async function searchOpenPOI(center, categoryKey) {
      const cat = CATEGORY_MAP[categoryKey] || CATEGORY_MAP.all;
      const params = new URLSearchParams({
        limit: 30
      });
      if (cat.q) params.set("q", cat.q);
      if (center) {
        params.set("center", `${center.lng},${center.lat}`); // lng,lat の順
        params.set("radius", 1500); // 1.5km
      } else if (!cat.q) {
        // 位置もキーワードも無い場合は東京駅周辺をデフォルト
        params.set("center", "139.7671,35.6812");
        params.set("radius", 1000);
        params.set("q", "カフェ");
      }

      const res = await fetch(`https://api.openpoiapi.com/v1/search?${params}`);
      if (!res.ok) throw new Error("検索APIエラー");
      const json = await res.json();
      return (json.results || []).map((r, i) => ({
        id: i + 1,
        name: r.name || "名称不明",
        address: r.address || `${r.prefecture || ""}${r.city || ""}`,
        category: r.category || r.business_type || "",
        lat: r.lat,
        lng: r.lng,
        icon: cat.icon,
        source: r.source || ""
      }));
    }

    function clearMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }

    function showMarkers(list) {
      clearMarkers();
      if (!list.length) return;
      const bounds = [];
      list.forEach(p => {
        if (!p.lat || !p.lng) return;
        const icon = L.divIcon({
          className: "",
          html: `<div class="marker-pin"><span>${p.icon}</span></div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 36],
          popupAnchor: [0, -36]
        });
        const m = L.marker([p.lat, p.lng], { icon }).addTo(map)
          .bindPopup(`
            <strong>${p.name}</strong>
            <div style="color:#6b7280;margin-top:4px;font-size:12px;">${p.address || ""}</div>
            <div style="margin-top:6px;font-size:11px;color:#9ca3af;">${p.category}</div>
          `);
        m.on("click", () => {
          activeId = p.id;
          renderList(list);
        });
        markers.push(m);
        bounds.push([p.lat, p.lng]);
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [60, 60], maxZoom: 15 });
    }

    function renderList(list) {
      currentResults = list;
      if (!list.length) {
        listEl.innerHTML = `<div class="empty">条件に合う施設が見つかりませんでした<br>場所やジャンルを変えて再検索してください</div>`;
        countText.textContent = "0件";
        sheet.classList.add("open");
        return;
      }
      countText.innerHTML = `<strong>${list.length}件</strong> 見つかりました`;
      listEl.innerHTML = list.map(p => `
        <div class="item ${activeId === p.id ? "active" : ""}" data-id="${p.id}">
          <div class="item-icon">${p.icon}</div>
          <div class="item-body">
            <div class="item-cat">${p.category || "施設"}</div>
            <div class="item-name">${p.name}</div>
            <div class="item-meta">${p.address || ""}</div>
          </div>
        </div>
      `).join("");

      listEl.querySelectorAll(".item").forEach(el => {
        el.addEventListener("click", () => {
          const id = +el.dataset.id;
          const p = list.find(x => x.id === id);
          if (!p) return;
          activeId = id;
          renderList(list);
          map.setView([p.lat, p.lng], 16);
          const m = markers.find(mk => {
            const ll = mk.getLatLng();
            return Math.abs(ll.lat - p.lat) < 0.0001;
          });
          if (m) m.openPopup();
        });
      });
      sheet.classList.add("open");
    }

    async function search() {
      searchBtn.disabled = true;
      searchBtn.textContent = "…";
      activeId = null;
      listEl.innerHTML = `<div class="empty">検索中…</div>`;
      sheet.classList.add("open");

      const q = locationInput.value.trim();
      const categoryKey = categorySelect.value;
      let center = null;

      try {
        if (q && q !== "現在地") {
          center = await geocode(q);
          if (!center) throw new Error("場所が見つかりませんでした");
          lastCenter = center;
        } else if (lastCenter && q === "現在地") {
          center = lastCenter;
        }

        const list = await searchOpenPOI(center, categoryKey);
        showMarkers(list);
        renderList(list);
      } catch (e) {
        console.error(e);
        listEl.innerHTML = `<div class="empty">検索に失敗しました<br>${e.message || ""}</div>`;
        countText.textContent = "エラー";
        clearMarkers();
      } finally {
        searchBtn.disabled = false;
        searchBtn.textContent = "探す";
      }
    }

    searchBtn.addEventListener("click", search);
    locationInput.addEventListener("keydown", e => { if (e.key === "Enter") search(); });

    document.getElementById("locBtn").addEventListener("click", () => {
      if (!navigator.geolocation) return alert("位置情報に対応していません");
      searchBtn.disabled = true;
      searchBtn.textContent = "…";
      navigator.geolocation.getCurrentPosition(
        pos => {
          lastCenter = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          locationInput.value = "現在地";
          search();
        },
        () => {
          alert("位置情報の取得に失敗しました");
          searchBtn.disabled = false;
          searchBtn.textContent = "探す";
        }
      );
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      locationInput.value = "";
      categorySelect.value = "all";
      lastCenter = null;
      activeId = null;
      clearMarkers();
      listEl.innerHTML = `<div class="empty">駅名や地名を入れて「探す」を押してください</div>`;
      countText.textContent = "場所を入れて探してください";
      sheet.classList.remove("open");
      map.setView([35.6812, 139.7671], 12);
    });
  </script>
</body>
</html>
